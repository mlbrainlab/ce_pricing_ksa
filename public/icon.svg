<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Outer Glow / Ambient Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1d4ed8" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Text Depth Shadow -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.75"/>
    </filter>

    <!-- Outer Bevel Rim Gradient -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Liquid Core Fluid Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="45%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Top Convex Lens Reflection -->
    <linearGradient id="lensGlare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Internal Caustic Glows -->
    <radialGradient id="causticTop" cx="15%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticBottom" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Liquid Glass Base Body with Ambient Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="116" fill="url(#liquidGrad)" filter="url(#shadow)"/>

  <!-- Liquid Core Gradient -->
  <rect x="36" y="36" width="440" height="440" rx="116" fill="url(#liquidGrad)"/>

  <!-- Internal Caustic Lights -->
  <rect x="36" y="36" width="440" height="440" rx="116" fill="url(#causticTop)"/>
  <rect x="36" y="36" width="440" height="440" rx="116" fill="url(#causticBottom)"/>

  <!-- Convex Lens Upper Glare Arc -->
  <path d="M 36 152 C 36 88 88 36 152 36 L 360 36 C 424 36 476 88 476 152 L 476 225 C 385 275 127 275 36 225 Z" fill="url(#lensGlare)"/>

  <!-- Inner Refractive Specular Rim -->
  <rect x="40" y="40" width="432" height="432" rx="112" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3"/>

  <!-- Crystalline Outer Bevel Border -->
  <rect x="36" y="36" width="440" height="440" rx="116" fill="none" stroke="url(#bevelGrad)" stroke-width="10"/>

  <!-- Embossed "CE" Lettermark -->
  <text x="256" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="204" letter-spacing="6" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" filter="url(#textShadow)">CE</text>
</svg>